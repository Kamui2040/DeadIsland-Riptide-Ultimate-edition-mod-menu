[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dirue-linux"
version = "0.1.0.dev0"
description = "Native Linux port core for Dead Island Riptide Ultimate Edition"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [{ name = "FireEyeEian and DIRUE Linux contributors" }]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7"]

[project.scripts]
dirue = "dirue.cli:main"

[project.gui-scripts]
dirue-gui = "dirue.gui:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
